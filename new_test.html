<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>New Test Page - Eric's Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <link href='fonts.googleapis.com' rel='stylesheet'>
</head>
<body>
  <header>
    <div class="container nav-inner">
      <div class="logo">
        <span class="mark"></span>
        <span>Eric — Portfolio</span>
      </div>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html#education">Education</a></li>
          <li><a href="index.html#experience">Experience</a></li>
          <li><a href="new_test.html">New Page</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container" style="margin-top:18px; display:flex; flex-direction:column; align-items:center;">
    <div class="page-selector-card">
      <!-- Dropdown Toggle -->
      <button class="dropdown-toggle" id="dropdown-toggle">
        <span id="selected-text">All pages</span>
        <span class="dropdown-arrow">▼</span>
      </button>

      <!-- Dropdown Content -->
      <div class="dropdown-content" id="dropdown-content">
        <ul class="page-list">
          <li class="page-item all-pages" data-page="all">
            <label class="page-label" for="page-all">All pages</label>
            <input type="checkbox" class="page-checkbox" id="page-all" checked>
          </li>
          <li class="page-item" data-page="1">
            <label class="page-label" for="page-1">Page 1</label>
            <input type="checkbox" class="page-checkbox" id="page-1">
          </li>
          <li class="page-item" data-page="2">
            <label class="page-label" for="page-2">Page 2</label>
            <input type="checkbox" class="page-checkbox" id="page-2">
          </li>
          <li class="page-item" data-page="3">
            <label class="page-label" for="page-3">Page 3</label>
            <input type="checkbox" class="page-checkbox" id="page-3">
          </li>
          <li class="page-item" data-page="4">
            <label class="page-label" for="page-4">Page 4</label>
            <input type="checkbox" class="page-checkbox" id="page-4">
          </li>
        </ul>
        
        <div class="selection-summary" id="selection-summary" style="display:none;">
          <span id="summary-text">0 pages selected</span>
        </div>
      </div>

      <!-- Done Button -->
      <button class="done-button" id="done-button">Done</button>
    </div>
  </main>

  <footer class="container">
    <p class="muted" style="padding-top:18px">
      <a href="index.html">← Back to Home</a>
    </p>
  </footer>

  <script>
    // Dropdown functionality
    const dropdownToggle = document.getElementById('dropdown-toggle');
    const dropdownContent = document.getElementById('dropdown-content');
    const selectedText = document.getElementById('selected-text');
    const doneButton = document.getElementById('done-button');
    const selectionSummary = document.getElementById('selection-summary');
    const summaryText = document.getElementById('summary-text');
    
    const allPagesCheckbox = document.getElementById('page-all');
    const pageCheckboxes = document.querySelectorAll('.page-checkbox:not(#page-all)');

    // Toggle dropdown
    dropdownToggle.addEventListener('click', () => {
      dropdownToggle.classList.toggle('active');
      dropdownContent.classList.toggle('active');
    });

    // Close dropdown when clicking outside
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.page-selector-card')) {
        dropdownToggle.classList.remove('active');
        dropdownContent.classList.remove('active');
      }
    });

    // Update button color based on selections
    function updateButtonColor() {
      const anyChecked = Array.from(pageCheckboxes).some(cb => cb.checked) || allPagesCheckbox.checked;
      
      if (anyChecked) {
        doneButton.classList.add('has-selection');
      } else {
        doneButton.classList.remove('has-selection');
      }
    }

    // Update summary text
    function updateSummary() {
      const checkedCount = Array.from(pageCheckboxes).filter(cb => cb.checked).length;
      syncAllPagesState();
    
      if (allPagesCheckbox.checked) {
        selectedText.textContent = 'All pages';
        selectionSummary.style.display = 'block';
        summaryText.textContent = 'All pages selected';
      } else if (checkedCount > 0) {
        selectedText.textContent = `${checkedCount} page${checkedCount > 1 ? 's' : ''} selected`;
        selectionSummary.style.display = 'block';
        summaryText.textContent = `${checkedCount} page${checkedCount > 1 ? 's' : ''} selected`;
      } else {
        selectedText.textContent = 'Select pages';
        selectionSummary.style.display = 'none';
      }
    
      updateButtonColor();
    }

    // Handle "All pages" checkbox
    function syncAllPagesState() {
      const allChecked = Array.from(pageCheckboxes).every(cb => cb.checked);
      allPagesCheckbox.checked = allChecked;
    }
    
    allPagesCheckbox.addEventListener('change', (e) => {
      if (!e.target.checked) {
        const pagesAllChecked = Array.from(pageCheckboxes).every(cb => cb.checked);
        if (pagesAllChecked) {
          pageCheckboxes.forEach(cb => cb.checked = false);
        }
      } else {
        pageCheckboxes.forEach(cb => cb.checked = true);
      }
      updateSummary();
    });
    
    pageCheckboxes.forEach(checkbox => {
      checkbox.addEventListener('change', () => {
        syncAllPagesState();
        updateSummary();
      });
    });

    // Handle clicking on list items (not just checkboxes)
    document.querySelectorAll('.page-item').forEach(item => {
      item.addEventListener('click', (e) => {
        if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'LABEL') {
          const checkbox = item.querySelector('.page-checkbox');
          checkbox.checked = !checkbox.checked;
          checkbox.dispatchEvent(new Event('change'));
        }
      });
    });

    // Done button action
    doneButton.addEventListener('click', () => {
      const selected = [];
      
      if (allPagesCheckbox.checked) {
        selected.push('All pages');
      } else {
        pageCheckboxes.forEach((cb, index) => {
          if (cb.checked) {
            selected.push(`Page ${index + 1}`);
          }
        });
      }
      
      if (selected.length > 0) {
        alert(`Selected: ${selected.join(', ')}`);
        // You can add your custom logic here
        // For example: navigate to another page, save selections, etc.
      } else {
        alert('Please select at least one page');
      }
    });

    // Initialize
    updateSummary();

    // Mobile nav (reuse from main script)
    document.getElementById('nav-toggle').addEventListener('click', ()=>{
      const mobile = document.getElementById('nav-menu-mobile');
      const shown = mobile.style.display === 'block';
      mobile.style.display = shown ? 'none' : 'block';
    });
  </script>
</body>
</html>
